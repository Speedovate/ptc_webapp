<!DOCTYPE html>
<html lang="en">
<head>
  <base href="/">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#5B34D6">
  <meta name="description" content="Install Paltranco Digital Platform.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Paltranco">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <title>Install Paltranco</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Avenir Next", "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      color: #171426;
      background:
        radial-gradient(circle at 12% 4%, rgba(123, 88, 238, 0.26), transparent 32rem),
        linear-gradient(150deg, #f8f7ff 0%, #ffffff 54%, #f4f1ff 100%);
    }

    main {
      width: min(100%, 540px);
      min-height: 100vh;
      margin: 0 auto;
      padding: max(30px, env(safe-area-inset-top)) 24px max(32px, env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 34px;
      color: #5B34D6;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .brand-mark {
      width: 14px;
      height: 14px;
      border-radius: 4px 4px 4px 0;
      background: #5B34D6;
      box-shadow: 7px 7px 0 #f6b641;
    }

    .card {
      overflow: hidden;
      border: 1px solid rgba(63, 44, 128, 0.11);
      border-radius: 30px;
      background: rgba(255, 255, 255, 0.88);
      box-shadow: 0 24px 64px rgba(42, 24, 104, 0.16);
    }

    .hero {
      position: relative;
      min-height: 185px;
      padding: 30px;
      display: flex;
      align-items: flex-end;
      overflow: hidden;
      background: linear-gradient(135deg, #4c2bb8, #7150df 62%, #9b82f8);
    }

    .hero::after {
      content: "";
      position: absolute;
      width: 210px;
      height: 210px;
      top: -92px;
      right: -72px;
      border: 26px solid rgba(255, 255, 255, 0.16);
      border-radius: 50%;
    }

    .app-icon {
      position: relative;
      z-index: 1;
      width: 106px;
      height: 106px;
      padding: 8px;
      border-radius: 27px;
      background: #fff;
      box-shadow: 0 18px 35px rgba(23, 12, 73, 0.27);
    }

    .app-icon img { width: 100%; height: 100%; object-fit: contain; }

    .content { padding: 30px; }

    h1 {
      margin: 0;
      font-size: clamp(28px, 7vw, 38px);
      line-height: 1.04;
      letter-spacing: -0.045em;
    }

    .subtitle {
      margin: 13px 0 25px;
      color: #625d70;
      font-size: 16px;
      line-height: 1.55;
    }

    #installPwa {
      width: 100%;
      min-height: 58px;
      border: 0;
      border-radius: 16px;
      color: #fff;
      background: #5B34D6;
      box-shadow: 0 12px 22px rgba(91, 52, 214, 0.27);
      font: inherit;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
    }

    #installPwa:active { transform: translateY(1px); }

    #installPwa[disabled] { opacity: 0.68; cursor: wait; }

    #installStatus {
      min-height: 44px;
      margin: 16px 4px 0;
      color: #676174;
      font-size: 13px;
      line-height: 1.45;
      text-align: center;
    }

    .steps {
      display: grid;
      gap: 11px;
      margin-top: 23px;
      padding: 18px;
      border-radius: 18px;
      background: #f5f2ff;
    }

    .steps strong { color: #392080; }

    .open-app {
      display: inline-block;
      margin: 27px auto 0;
      color: #5B34D6;
      font-size: 14px;
      font-weight: 750;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main>
    <div class="brand"><span class="brand-mark"></span>Paltranco</div>
    <section class="card" aria-labelledby="install-title">
      <div class="hero">
        <div class="app-icon"><img src="icons/Icon-512.png" alt="Paltranco app icon"></div>
      </div>
      <div class="content">
        <h1 id="install-title">Install Paltranco</h1>
        <p class="subtitle">Add Paltranco to your home screen for a faster, app-like booking experience.</p>
        <button id="installPwa" type="button">Install app</button>
        <p id="installStatus" role="status">Checking installation support...</p>
        <div id="manualSteps" class="steps" hidden></div>
        <a class="open-app" href="/">Open in browser</a>
      </div>
    </section>
  </main>
  <script src="script/installpwa.js"></script>
</body>
</html>
