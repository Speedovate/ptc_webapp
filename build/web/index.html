<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover"
  >
  <meta
    name="description"
    content="Transport at your fingertips."
  >
  <meta name="robots" content="index, follow">
  <meta name="theme-color" content="#5B34D6">
  <meta name="application-name" content="Paltranco Digital Platform">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Paltranco Digital Platform">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Paltranco Digital Platform">
  <meta property="og:title" content="Paltranco Digital Platform">
  <meta property="og:description" content="Transport at your fingertips.">
  <meta property="og:url" content="https://paltranco.vercel.app/">
  <meta property="og:image" content="https://paltranco.vercel.app/social-preview.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1080">
  <meta property="og:image:height" content="1080">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Paltranco Digital Platform">
  <meta name="twitter:description" content="Transport at your fingertips.">
  <meta name="twitter:image" content="https://paltranco.vercel.app/social-preview.png">
  <link rel="canonical" href="https://paltranco.vercel.app/">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon-180.png">
  <link rel="apple-touch-icon" sizes="167x167" href="icons/apple-touch-icon-167.png">
  <link rel="apple-touch-icon" sizes="152x152" href="icons/apple-touch-icon-152.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Paltranco Digital Platform</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      margin: 0;
      min-height: 100%;
      background: #5c33cf;
      font-family: "Segoe UI", sans-serif;
    }

    body {
      overflow: hidden;
    }

    #bootstrap-loader {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      box-sizing: border-box;
      color: #ffffff;
    }

    .bootstrap-card {
      width: min(260px, 100%);
      min-height: 72px;
      padding: 12px 20px;
      border-radius: 18px;
      background: #ffffff;
      border: 1px solid #d7cff7;
      box-sizing: border-box;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .bootstrap-spinner {
      width: 28px;
      height: 28px;
      border-radius: 999px;
      box-sizing: border-box;
      border: 3px solid rgba(92, 51, 207, 0.18);
      border-top-color: #5c33cf;
      animation: bootstrap-spin 0.85s linear infinite;
      flex: 0 0 auto;
    }

    .bootstrap-copy {
      margin: 0;
      color: #1f2333;
      font-size: 15px;
      font-weight: 700;
      line-height: 1.25;
    }

    @keyframes bootstrap-spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="bootstrap-loader" aria-live="polite">
    <div class="bootstrap-card">
      <div class="bootstrap-spinner" aria-hidden="true"></div>
      <p class="bootstrap-copy">Starting Paltranco and preparing offline data ...</p>
    </div>
  </div>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
