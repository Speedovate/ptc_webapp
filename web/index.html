<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover"
  >
  <meta
    name="description"
    content="Transport at your fingertips."
  >
  <meta name="robots" content="index, follow">
  <meta name="theme-color" content="#5B34D6">
  <meta name="application-name" content="Paltranco Digital Platform">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Paltranco Digital Platform">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Paltranco Digital Platform">
  <meta property="og:title" content="Paltranco Digital Platform">
  <meta property="og:description" content="Transport at your fingertips.">
  <meta property="og:url" content="https://paltranco.vercel.app/">
  <meta property="og:image" content="https://paltranco.vercel.app/social-preview.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1080">
  <meta property="og:image:height" content="1080">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Paltranco Digital Platform">
  <meta name="twitter:description" content="Transport at your fingertips.">
  <meta name="twitter:image" content="https://paltranco.vercel.app/social-preview.png">
  <link rel="canonical" href="https://paltranco.vercel.app/">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon-180.png">
  <link rel="apple-touch-icon" sizes="167x167" href="icons/apple-touch-icon-167.png">
  <link rel="apple-touch-icon" sizes="152x152" href="icons/apple-touch-icon-152.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Paltranco Digital Platform</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      margin: 0;
      min-height: 100%;
      background:
        radial-gradient(circle at top, rgba(255, 255, 255, 0.18), transparent 38%),
        linear-gradient(180deg, #6a3df2 0%, #4b25b6 100%);
      font-family: "Segoe UI", sans-serif;
    }

    body {
      overflow: hidden;
    }

    #bootstrap-loader {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      box-sizing: border-box;
      color: #ffffff;
    }

    .bootstrap-card {
      width: min(420px, 100%);
      padding: 28px 24px;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 20px 60px rgba(26, 11, 72, 0.25);
      backdrop-filter: blur(10px);
    }

    .bootstrap-title {
      margin: 0 0 10px;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 0.01em;
    }

    .bootstrap-copy {
      margin: 0;
      line-height: 1.5;
      color: rgba(255, 255, 255, 0.88);
      font-size: 14px;
      font-weight: 500;
    }

    .bootstrap-progress {
      margin-top: 18px;
      height: 8px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.14);
      overflow: hidden;
      position: relative;
    }

    .bootstrap-progress::after {
      content: "";
      position: absolute;
      inset: 0;
      width: 42%;
      border-radius: inherit;
      background: linear-gradient(90deg, #ffffff 0%, #d8c7ff 100%);
      animation: bootstrap-slide 1.2s ease-in-out infinite;
    }

    @keyframes bootstrap-slide {
      0% { transform: translateX(-115%); }
      100% { transform: translateX(320%); }
    }
  </style>
</head>
<body>
  <div id="bootstrap-loader" aria-live="polite">
    <div class="bootstrap-card">
      <h1 class="bootstrap-title">Paltranco Digital Platform</h1>
      <p class="bootstrap-copy">
        Starting app and preparing offline data so the web app is ready even when signal is weak.
      </p>
      <div class="bootstrap-progress"></div>
    </div>
  </div>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
