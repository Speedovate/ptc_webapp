<!DOCTYPE html>
<html lang="en">
<head>
  <base href="/">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#5B34D6">
  <meta name="description" content="Install Paltranco Digital Platform.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Paltranco">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <title>Install Paltranco</title>
  <style>
    :root {
      color-scheme: light;
      --paltranco-purple: #5c33cf;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100vh;
      padding: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--paltranco-purple);
      color: rgba(16, 24, 40, 0.88);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    #download-card {
      width: min(100%, 420px);
      padding: 28px 24px;
      border: 1px solid rgba(255, 255, 255, 0.24);
      border-radius: 28px;
      background: #FFFFFF;
      box-shadow: 0 28px 80px rgba(16, 24, 40, 0.24);
      text-align: center;
    }

    #download-logo {
      width: min(180px, 52vw);
      height: auto;
      display: block;
      margin: 0 auto 24px;
    }

    #install-title {
      margin: 0 0 12px;
      color: var(--paltranco-purple);
      font-size: 30px;
      font-weight: 700;
      line-height: 1.05;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    #download-body {
      margin: 0;
      font-size: 15px;
      font-weight: 500;
      line-height: 1.65;
    }

    #download-actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 24px;
    }

    .download-button {
      width: 100%;
      border-radius: 999px;
      padding: 15px 18px;
      cursor: pointer;
      font: 700 16px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0.08em;
      text-align: center;
      text-decoration: none;
      text-transform: uppercase;
      transition: transform 160ms ease, opacity 160ms ease, background 160ms ease;
    }

    .download-button:hover { transform: translateY(-1px); }

    #installPwa {
      border: 0;
      color: #FFFFFF;
      background: var(--paltranco-purple);
    }

    #installPwa[disabled] { cursor: wait; opacity: 0.68; }

    .download-button--secondary {
      border: 1px solid rgba(92, 51, 207, 0.24);
      color: var(--paltranco-purple);
      background: transparent;
    }

    #installStatus,
    #manualSteps {
      margin: 16px 0 0;
      color: rgba(52, 64, 84, 0.72);
      font-size: 12px;
      font-weight: 500;
      line-height: 1.55;
    }

    #manualSteps {
      display: grid;
      gap: 3px;
    }

    #manualSteps strong {
      color: rgba(16, 24, 40, 0.88);
      font-size: 13px;
    }

    #manualSteps[hidden] { display: none; }

    @media (max-width: 420px) {
      body { padding: 18px; }
      #download-card { padding: 26px 20px; }
      #install-title { font-size: 27px; }
    }
  </style>
</head>
<body>
  <main id="download-card" aria-labelledby="install-title">
    <img
      id="download-logo"
      src="assets/assets/icon.png"
      alt="Paltranco Digital Platform"
    >
    <h1 id="install-title">Install App</h1>
    <p id="download-body">
      Add Paltranco to your home screen for a faster, app-like booking experience.
    </p>
    <div id="download-actions">
      <button id="installPwa" class="download-button" type="button">Install</button>
      <a class="download-button download-button--secondary" href="/">Open In Browser</a>
    </div>
    <p id="installStatus" role="status">Checking installation support...</p>
    <div id="manualSteps" hidden></div>
  </main>
  <script src="script/installpwa.js"></script>
</body>
</html>
