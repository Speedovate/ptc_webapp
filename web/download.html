<!DOCTYPE html>
<html lang="en">
<head>
  <base href="/">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#5B34D6">
  <meta name="description" content="Install Paltranco Digital Platform.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Paltranco">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <title>Install Paltranco</title>
  <style>
    :root { color-scheme: light; }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      height: 100vh;
      height: 100dvh;
      padding: max(20px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
      display: flex;
      align-items: center;
      justify-content: center;
      background: #5B34D6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    #install-card {
      width: min(100%, 460px);
      padding: 26px 28px 28px;
      border: 1px solid #E4D8FF;
      border-radius: 24px;
      background: #FFFFFF;
      overflow: hidden;
    }

    #install-header {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    #install-logo-wrap {
      width: 56px;
      height: 56px;
      padding: 6px;
      flex: 0 0 56px;
      border-radius: 18px;
      background: #5B34D6;
    }

    #install-logo {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    #install-brand {
      margin: 0;
      color: #5B34D6;
      font-size: 25px;
      font-weight: 800;
      line-height: 1.2;
    }

    #install-product {
      margin: 0;
      color: #221A3F;
      font-size: 15px;
      font-weight: 500;
      line-height: 1.2;
    }

    #installPwa {
      width: 100%;
      height: 52px;
      margin-top: 24px;
      border: 0;
      border-radius: 18px;
      color: #FFFFFF;
      background: #5B34D6;
      box-shadow: none;
      cursor: pointer;
      font: 700 14px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      transition: background 160ms ease, transform 160ms ease, opacity 160ms ease;
    }

    #installPwa:hover { background: #4C2BB8; }
    #installPwa:active { transform: translateY(1px); }
    #installPwa[disabled] { cursor: wait; opacity: 0.68; }

    @media (max-width: 420px) {
      #install-card { padding: 26px 28px 28px; }
    }
  </style>
</head>
<body>
  <main id="install-card" aria-label="Install Paltranco">
    <div id="install-header">
      <div id="install-logo-wrap">
        <img id="install-logo" src="assets/assets/icon.png" alt="Paltranco">
      </div>
      <div>
        <p id="install-brand">Paltranco</p>
        <p id="install-product">Digital Platform</p>
      </div>
    </div>
    <button id="installPwa" type="button">Install</button>
  </main>
  <script src="script/installpwa.js"></script>
</body>
</html>
